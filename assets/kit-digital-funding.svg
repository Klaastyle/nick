<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 92" role="img" aria-labelledby="title desc">
  <title id="title">Financiado por la Union Europea y Plan de Recuperacion</title>
  <desc id="desc">Distintivos de la Union Europea, NextGenerationEU y Plan de Recuperacion, Transformacion y Resiliencia</desc>
  <rect width="520" height="92" fill="none"/>
  <g>
    <rect x="4" y="20" width="84" height="52" fill="#244aa5"/>
    <circle cx="46" cy="46" r="18" fill="none" stroke="#ffdf00" stroke-dasharray="1 8" stroke-linecap="round" stroke-width="4"/>
    <text x="102" y="34" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Financiado por</text>
    <text x="102" y="52" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">la Union Europea</text>
    <text x="102" y="70" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13">NextGenerationEU</text>
  </g>
  <g transform="translate(292 17)">
    <text x="0" y="43" fill="#f4c13d" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="800">P</text>
    <text x="25" y="43" fill="#d84b38" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="800">R</text>
    <text x="-34" y="18" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Plan de Recuperacion,</text>
    <text x="72" y="37" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Transformacion</text>
    <text x="72" y="55" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">y Resiliencia</text>
  </g>
</svg>
